:root{--bg:#1A0846; --card:#2A1270; --card2:#341A86; --line:rgba(255,255,255,.12); --ink:#fff; --muted:#C9BDF2; --gold:#FFD23F; --orange:#FF9F1C; --green:#2DBE60; --red:#FF5A6E; --blue:#5BB8FF}
*{box-sizing:border-box} html,body{margin:0} html{background:#1A0846}
body{font-family:Fredoka,system-ui,sans-serif; background:radial-gradient(circle at 50% -10%,#4A1BA8,var(--bg) 60%) fixed; color:var(--ink); min-height:100vh}
button,input,select{font:inherit; color:inherit}
.wrap{max-width:980px; margin:0 auto; padding:16px 16px 60px}
header{display:flex; align-items:center; gap:12px; padding:6px 0 14px}
header img{width:40px; height:40px} header h1{margin:0; font-size:24px; flex:1} header h1 small{color:var(--muted); font-weight:500; font-size:15px}
.who{color:var(--muted); font-size:14px; text-align:left; direction:ltr}
.btn{border:none; border-radius:14px; padding:10px 18px; font-weight:700; cursor:pointer; background:var(--card2); box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(#FFCB52,#F59A0C); color:#4A2300} .btn.green{background:linear-gradient(#5BD46D,#2FA84A)} .btn.ghost{background:transparent; box-shadow:none; border:1px solid var(--line)}
.btn.red{background:linear-gradient(#FF6B7E,#D6334A)} .danger{margin-top:18px; border:1px solid rgba(255,90,110,.45); background:rgba(255,90,110,.08); border-radius:16px; padding:4px 14px 14px} .danger h3{color:#FF8A98} .danger p{color:var(--muted); font-size:14px; margin:0 0 8px} .danger label{display:flex; gap:8px; align-items:flex-start; font-size:14px; margin-bottom:10px} .danger input{margin-top:4px}
.btn:disabled{opacity:.5; cursor:default}
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none}
.tabs button{border:none; background:var(--card); color:var(--muted); padding:10px 16px; border-radius:999px; font-weight:600; white-space:nowrap; cursor:pointer}
.tabs button.on{background:var(--gold); color:#3A1A00}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px} .stat b{display:block; font-size:30px; line-height:1.1; direction:ltr; text-align:right} .stat span{color:var(--muted); font-size:14px}
.stat.hot b{color:var(--gold)}
.panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-top:14px} .panel h2{margin:0 0 12px; font-size:19px}
.chart{display:grid; grid-template-columns:repeat(14,1fr); gap:6px; align-items:end; height:150px; padding-top:8px}
.chart .col{display:flex; gap:2px; align-items:end; height:100%} .chart i{flex:1; border-radius:5px 5px 0 0; min-height:2px; position:relative}
.chart i.a{background:var(--blue)} .chart i.b{background:var(--gold)}
.chart i:hover::after{content:attr(data-v); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#000; padding:2px 6px; border-radius:6px; font-size:12px; font-style:normal; white-space:nowrap}
.days{display:grid; grid-template-columns:repeat(14,1fr); gap:6px; color:var(--muted); font-size:11px; text-align:center; margin-top:4px; direction:ltr}
.legend{display:flex; gap:16px; color:var(--muted); font-size:13px; margin-top:8px} .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px}
.bar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap} .bar input{flex:1; min-width:180px; border:1px solid var(--line); background:#130536; border-radius:14px; padding:11px 14px} .bar select{border:1px solid var(--line); background:#130536; border-radius:14px; padding:10px}
.list{display:flex; flex-direction:column; gap:8px}
.row{display:flex; align-items:center; gap:12px; background:var(--card2); border-radius:16px; padding:10px 12px; cursor:pointer; border:1px solid transparent} .row:hover{border-color:var(--gold)}
.av{width:44px; height:44px; border-radius:50%; background:#4A2BA8; flex:none; display:grid; place-items:center; position:relative} .av img{width:40px; height:40px; object-fit:contain}
.av i{position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%; background:#8a7fb0; border:2px solid var(--card2)} .av i.on{background:var(--green)}
.row .nm{flex:1; min-width:0} .row .nm b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .row .nm small{color:var(--muted)}
.num{text-align:center; min-width:56px} @media (max-width:520px){ .num.opt{display:none} } .num b{display:block; direction:ltr} .num small{color:var(--muted); font-size:12px}
table{width:100%; min-width:600px; border-collapse:collapse; font-size:14px} th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:center} th{color:var(--muted); font-weight:600; cursor:pointer; white-space:nowrap; position:sticky; top:0; background:var(--card)} td:first-child,th:first-child{text-align:right}
tr.hard td{color:#FFB3BD} .scroll{overflow:auto; max-height:70vh}
.pill{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#4A2BA8} .pill.g{background:#1E7A41} .pill.r{background:#8E1F33} .pill.y{background:#8A5A00}
.feed{display:flex; flex-direction:column; gap:6px} .feed div{background:var(--card2); border-radius:12px; padding:9px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap} .feed small{color:var(--muted); margin-inline-start:auto}
.cover{position:fixed; inset:0; background:rgba(8,2,30,.7); display:grid; place-items:center; padding:16px; z-index:10}
.sheet{background:#22105E; border:1px solid var(--line); border-radius:24px; width:min(640px,100%); max-height:90vh; overflow:auto; padding:20px; position:relative}
.sheet .x{position:absolute; top:12px; left:12px} .phead{display:flex; gap:14px; align-items:center; margin-bottom:14px} .phead .av{width:66px; height:66px} .phead .av img{width:60px; height:60px} .phead h2{margin:0} .phead small{color:var(--muted); direction:ltr; display:inline-block}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px} .kv div{background:var(--card2); border-radius:12px; padding:9px 12px} .kv b{display:block; font-size:20px; direction:ltr; text-align:right} .kv span{color:var(--muted); font-size:13px}
.chips{display:flex; flex-wrap:wrap; gap:6px} .chips span{background:var(--card2); padding:4px 10px; border-radius:999px; font-size:13px}
.giftf{display:flex; gap:8px; flex-wrap:wrap; align-items:center} .giftf input{border:1px solid var(--line); background:#130536; border-radius:12px; padding:10px; width:120px; direction:ltr} .giftf input.note{flex:1; min-width:150px; width:auto; direction:rtl}
.center{min-height:80vh; display:grid; place-items:center; text-align:center} .center img{width:110px} .center p{color:var(--muted); max-width:340px}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000c; padding:12px 20px; border-radius:14px; z-index:20}
h3{margin:18px 0 8px; font-size:16px; color:var(--gold)} .empty{color:var(--muted); padding:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BACKEND = { url: 'https://lwtimaunczpjfvppmudd.supabase.co', key: 'sb_publishable_ll8ay08mufmaqKP1NHBnVQ_Xtn2EXBW' };
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (+n || 0).toLocaleString('he-IL');
const ago = t => { if (!t) return 'אף פעם'; const m = (Date.now() - new Date(t)) / 60000; if (m < 2) return 'עכשיו'; if (m < 60) return `לפני ${Math.round(m)} דק׳`; if (m < 1440) return `לפני ${Math.round(m / 60)} שע׳`; return `לפני ${Math.round(m / 1440)} ימים`; };
const when = t => t ? new Date(t).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const av = (k, on) => `<span class="av"><img alt="" src="/media/chars/${esc(k || 'owl')}.webp" onerror="this.src='/icons/icon-192.png'">${on === undefined ? '' : `<i class="${on ? 'on' : ''}"></i>`}</span>`;
const dur = s => { s = +s || 0; if (s < 60) return s ? 'פחות מדקה' : '0 דק׳'; const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} שע׳ ${m} דק׳` : `${m} דק׳`; };
const hm = t => new Date(t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
const noteOf = n => ({ 'gift from the owner': 'מתנה ממך', friend: 'מחבר' }[n] || n || '');
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };

/* ---- the owner's session: Google sign-in through Supabase, kept in this browser only ---- */
const KEY = 'beamAdminSession';
const Sess = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(s) { try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (e) {} },
  async token() {
    const s = Sess.get(); if (!s) return null;
    if (Date.now() < s.expires_at - 60000) return s.access_token;
    try {
      const r = await fetch(`${BACKEND.url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: BACKEND.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) throw 0;
      const j = await r.json(); const n = { ...s, access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + j.expires_in * 1000 };
      Sess.set(n); return n.access_token;
    } catch (e) { Sess.set(null); return null; }
  },
};
function signIn() {
  try { localStorage.setItem('beamAdminPending', '1'); } catch (e) {}
  location.href = `${BACKEND.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.origin + '/admin/')}`;
}
async function signOut() {
  const t = await Sess.token();
  if (t) fetch(`${BACKEND.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: BACKEND.key, Authorization: 'Bearer ' + t } }).catch(() => {});
  Sess.set(null); boot();
}
async function rpc(fn, args = {}) {
  const t = await Sess.token(); if (!t) throw new Error('signed out');
  const r = await fetch(`${BACKEND.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: BACKEND.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(r.status === 401 ? 'signed out' : 'server ' + r.status);
  return r.json();
}

/* ---- level names: read straight from the game page, so they always match the live levels ---- */
let LEVELS = {};
async function loadLevelNames() {
  try {
    // the game's code and levels live in their own files since the page was split
    const src = (await Promise.all(['/js/levels.js', '/js/game.js'].map(async u => (await fetch(u, { cache: 'no-store' })).text()))).join('\n');
    await loadItemNames(src);
    const m = src.match(/const CHAPTERS = (\[.*?\]);\s*\n/s);
    const ch = JSON.parse(m[1]); let n = 0;
    ch.forEach((c, ci) => c.levels.forEach((l, li) => { n++; LEVELS[l.id] = { n, ch: ci + 1, chName: c.name, max: l.max, size: l.rows.length }; }));
  } catch (e) { LEVELS = {}; }
}

/* ---- screens ---- */
let tab = 'overview', me = '';
function shell(body) {
  app.innerHTML = `<div class="wrap"><header><img src="/icons/icon-192.png" alt=""><h1>BEAM <small>· ניהול</small></h1><span class="who">${esc(me)}</span><button class="btn ghost" id="out">יציאה</button></header>
    <nav class="tabs">${[['overview', 'סקירה'], ['players', 'שחקנים'], ['buys', 'רכישות'], ['levels', 'שלבים'], ['activity', 'מתנות ודו-קרבים']].map(([k, t]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${t}</button>`).join('')}</nav><main id="main">${body}</main></div>`;
  $('#out').onclick = signOut;
  for (const b of document.querySelectorAll('[data-t]')) b.onclick = () => { tab = b.dataset.t; show(); };
}
async function show() {
  shell('<p class="empty">טוען…</p>');
  try { await ({ overview, players, buys, levels, activity })[tab](); }
  catch (e) { if (e.message === 'signed out') return boot(); $('#main').innerHTML = `<p class="empty">משהו נכשל בטעינה (${esc(e.message)}). נסו שוב.</p>`; }
}
async function overview() {
  const [o, pt] = await Promise.all([rpc('beam_admin_overview'), rpc('beam_admin_playtime')]);
  const cards = [['online', 'מחוברים עכשיו', 1], ['active_today', 'פעילים היום'], ['new_today', 'שחקנים חדשים היום'], ['players', 'שחקנים בסך הכול'], ['solves_today', 'שלבים שנפתרו היום', 1], ['starts_today', 'שלבים שהתחילו היום'],
    ['duels_today', 'דו-קרבים היום'], ['daily_today', 'שיחקו באתגר היומי'], ['active_week', 'פעילים השבוע'], ['new_week', 'חדשים השבוע'], ['friendships', 'חברויות'], ['accounts', 'מחוברים עם Google'], ['gifts_today', 'נקודות במתנות בין חברים היום']];
  const max = Math.max(1, ...o.by_day.map(d => Math.max(d.joined, d.solves)));
  $('#main').innerHTML = `<div class="grid">${cards.map(([k, t, hot]) => `<div class="stat${hot ? ' hot' : ''}"><b>${fmt(o[k])}</b><span>${t}</span></div>`).join('')}</div>
    <div class="panel"><h2>14 הימים האחרונים</h2>
      <div class="chart">${o.by_day.map(d => `<div class="col"><i class="a" style="height:${d.joined / max * 100}%" data-v="${d.joined} חדשים"></i><i class="b" style="height:${d.solves / max * 100}%" data-v="${d.solves} פתרונות"></i></div>`).join('')}</div>
      <div class="days">${o.by_day.map(d => `<span>${d.d.slice(8, 10)}/${d.d.slice(5, 7)}</span>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--blue)"></i>שחקנים חדשים</span><span><i style="background:var(--gold)"></i>שלבים שנפתרו</span></div></div>
    <div class="panel"><h2>זמן משחק</h2><div class="grid"><div class="stat hot"><b>${dur(pt.today)}</b><span>זמן משחק כולל היום</span></div><div class="stat"><b>${fmt(pt.visits_today)}</b><span>כניסות היום</span></div><div class="stat"><b>${dur(pt.avg)}</b><span>כניסה ממוצעת (שבוע)</span></div></div>
      <h3>במשחק עכשיו</h3><div class="feed">${pt.live.length ? pt.live.map(l => `<div class="buyer" data-id="${esc(l.player_id)}" style="cursor:pointer">${av(l.avatar, true)}<b>${esc(l.name || '(בלי שם)')}</b><span>נכנס ב-${hm(l.started_at)}</span><small>${dur((Date.now() - new Date(l.started_at)) / 1000)} עד עכשיו</small></div>`).join('') : '<p class="empty">אף אחד לא במשחק כרגע.</p>'}</div></div>`;
  for (const b of document.querySelectorAll('.buyer')) b.onclick = () => player(b.dataset.id);
}
let pq = '', psort = 'seen';
async function players() {
  $('#main').innerHTML = `<div class="bar"><input id="q" placeholder="חיפוש לפי שם או מזהה" value="${esc(pq)}"><select id="sort"><option value="seen">פעילות אחרונה</option><option value="total">ניקוד</option><option value="new">הצטרפו לאחרונה</option></select><button class="btn gold" id="go">חיפוש</button></div><div class="list" id="plist"><p class="empty">טוען…</p></div>`;
  $('#sort').value = psort;
  const run = async () => {
    pq = $('#q').value.trim(); psort = $('#sort').value;
    const [list, pt] = await Promise.all([rpc('beam_admin_players', { p_q: pq, p_sort: psort }), rpc('beam_admin_playtime')]);
    $('#plist').innerHTML = list.length ? list.map(p => `<div class="row" data-id="${esc(p.id)}">${av(p.avatar, p.seen && Date.now() - new Date(p.seen) < 120000)}
      <span class="nm"><b>${esc(p.name || '(בלי שם)')}</b><small>${ago(p.seen)}${p.account ? ' · Google' : ''}</small></span>
      <span class="num opt"><b>${dur(pt.per_player[p.id] || 0).replace(' דק׳', '′')}</b><small>היום</small></span><span class="num opt"><b>${fmt(p.levels)}</b><small>שלבים</small></span><span class="num"><b>${fmt(p.total)}</b><small>ניקוד</small></span><span class="num"><b>${fmt(p.balance)}</b><small>בארנק</small></span></div>`).join('') : '<p class="empty">לא נמצאו שחקנים.</p>';
    for (const r of document.querySelectorAll('[data-id]')) r.onclick = () => player(r.dataset.id);
  };
  const banned = await rpc('beam_admin_banned');
  if (banned.length) {
    const box = document.createElement('div'); box.className = 'panel';
    box.innerHTML = `<h2>חסומים</h2><div class="feed">${banned.map(b => `<div><b>${esc(b.name || '(בלי שם)')}</b><span style="color:var(--muted); direction:ltr">${esc(b.id)}</span><small>${when(b.at)}</small><button class="btn" data-unb="${esc(b.id)}">ביטול חסימה</button></div>`).join('')}</div>`;
    $('#main').appendChild(box);
    for (const u of box.querySelectorAll('[data-unb]')) u.onclick = async () => { if (!confirm('לבטל את החסימה? השחקן יוכל לחזור לשחק, והמשחק במכשיר שלו יעלה אותו מחדש.')) return; await rpc('beam_admin_unblock', { p_id: u.dataset.unb }); toast('החסימה בוטלה'); show(); };
  }
  $('#go').onclick = run; $('#sort').onchange = run; $('#q').onkeydown = e => { if (e.key === 'Enter') run(); };
  await run();
}
async function player(id) {
  const cover = document.createElement('div'); cover.className = 'cover'; cover.innerHTML = '<div class="sheet"><p class="empty">טוען…</p></div>'; document.body.appendChild(cover);
  cover.onclick = e => { if (e.target === cover) cover.remove(); };
  const [p, ss] = await Promise.all([rpc('beam_admin_player', { p_id: id }), rpc('beam_admin_sessions', { p_id: id })]);
  if (!p) { cover.querySelector('.sheet').innerHTML = '<p class="empty">השחקן לא נמצא.</p>'; return; }
  const d = p.duel || {}, on = p.seen && Date.now() - new Date(p.seen) < 120000;
  const st = { level: 'משחק בשלב', duel: 'בדו-קרב', home: 'במסך הבית' }[p.state] || '';
  cover.querySelector('.sheet').innerHTML = `<button class="btn ghost x" id="px">✕</button>
    <div class="phead">${av(p.avatar, on)}<div><h2>${esc(p.name || '(בלי שם)')}</h2><span class="pill${on ? ' g' : ''}">${on ? 'מחובר' + (st ? ' · ' + st : '') : ago(p.seen)}</span> <small>${esc(p.id)}</small></div></div>
    <div class="kv"><div><b>${fmt(p.balance)}</b><span>נקודות בארנק</span></div><div><b>${fmt(p.total)}</b><span>ניקוד בטבלה</span></div><div><b>${fmt(p.levels)}</b><span>שלבים שנפתרו</span></div><div><b>${fmt(p.stars)}</b><span>כוכבים</span></div>
      <div><b>${fmt(d.w)}–${fmt(d.l)}</b><span>דו-קרבים (ניצחונות–הפסדים)</span></div><div><b>${fmt(p.friends)}</b><span>חברים</span></div></div>
    <h3>כניסות למשחק</h3>
    <div class="kv"><div><b>${dur(ss.today)}</b><span>היום</span></div><div><b>${dur(ss.week)}</b><span>השבוע</span></div><div><b>${dur(ss.total)}</b><span>בסך הכול</span></div><div><b>${fmt(ss.count)}</b><span>כניסות</span></div></div>
    <div class="feed" style="margin-top:8px">${ss.list.length ? ss.list.map(v => `<div><b>${new Date(v.started_at).toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' })}</b><span>נכנס ${hm(v.started_at)} · ${v.live ? '<span class="pill g">עדיין במשחק</span>' : 'יצא ' + hm(v.last_at)}</span><small>${dur(v.secs)}</small></div>`).join('') : '<p class="empty">אין עדיין כניסות רשומות. הרישום התחיל היום, והשחקן צריך להיות בגרסה החדשה של המשחק.</p>'}</div>
    <h3>שליחת נקודות</h3>
    <div class="giftf"><input id="amt" type="number" min="1" max="1000000" placeholder="סכום"><input class="note" id="note" placeholder="הערה (לא חובה)">${[500, 1000, 5000].map(n => `<button class="btn" data-n="${n}">${fmt(n)}</button>`).join('')}<button class="btn green" id="send">שליחה</button></div>
    <h3>פרטים</h3><div class="chips"><span>הצטרף ${when(p.created_at)}</span><span>${p.account ? 'מחובר עם Google' : 'אורח (בלי חשבון)'}</span>${p.visible === false ? '<span>מוסתר מחברים</span>' : ''}${p.look && p.look.board ? `<span>לוח: ${esc(p.look.board)}</span>` : ''}</div>
    <h3>מה קנה</h3><div class="chips">${(p.own || []).length ? p.own.map(k => `<span>${esc(itemOf(k).name)} · ${esc(itemOf(k).cat)}</span>`).join('') : '<span>עוד לא קנה כלום</span>'}</div>
    <h3>מתנות שקיבל</h3><div class="feed">${(p.gifts || []).length ? p.gifts.map(g => `<div><b>+${fmt(g.amount)}</b><span>${esc(g.from_name ? 'מ-' + g.from_name : noteOf(g.note))}</span><small>${when(g.created_at)} · ${g.claimed_at ? 'נאסף' : '<span class="pill y">ממתין</span>'}</small></div>`).join('') : '<p class="empty">אין.</p>'}</div>
    <div class="danger"><h3>מחיקת שחקן</h3><p>מוחק את השחקן מהשרת: מטבלת המובילים, מהחברים של אחרים, מהדו-קרבים ומהמתנות. אי אפשר לבטל.</p>
      <label><input type="checkbox" id="blk" checked> לחסום אותו מלחזור (בלי חסימה, המשחק במכשיר שלו יעלה אותו מחדש בפעם הבאה שהוא משחק)</label>
      <button class="btn red" id="del">מחיקת ${esc(p.name || 'השחקן')}</button></div>
    <h3>דו-קרבים אחרונים</h3><div class="feed">${(p.duels || []).length ? p.duels.map(x => { const mine = x.me_p1 ? 1 : 2, won = x.winner === mine; return `<div><span class="pill ${x.winner ? (won ? 'g' : 'r') : ''}">${x.winner ? (won ? 'ניצחון' : 'הפסד') : 'לא הסתיים'}</span><span>מול ${esc(x.me_p1 ? x.p2_name : x.p1_name)} · ${x.me_p1 ? x.p1_wins : x.p2_wins}:${x.me_p1 ? x.p2_wins : x.p1_wins}${x.stake ? ' · על ' + fmt(x.stake) : ''}</span><small>${when(x.created_at)}</small></div>`; }).join('') : '<p class="empty">אין.</p>'}</div>`;
  $('#px').onclick = () => cover.remove();
  $('#del').onclick = async () => {
    const block = $('#blk').checked;
    if (!confirm(`למחוק את ${p.name || p.id}${block ? ' ולחסום אותו' : ''}? אי אפשר לבטל את המחיקה.`)) return;
    $('#del').disabled = true;
    try { const r = await rpc('beam_admin_delete', { p_id: p.id, p_block: block }); toast(r === 'ok' ? `${p.name || 'השחקן'} נמחק${block ? ' ונחסם' : ''}` : 'השחקן כבר לא קיים'); cover.remove(); if (tab === 'players') show(); }
    catch (e) { toast('המחיקה נכשלה'); $('#del').disabled = false; }
  };
  for (const b of cover.querySelectorAll('[data-n]')) b.onclick = () => { $('#amt').value = b.dataset.n; };
  $('#send').onclick = async () => {
    const n = Math.round(+$('#amt').value);
    if (!(n >= 1 && n <= 1000000)) return toast('סכום בין 1 ל-1,000,000');
    if (!confirm(`לשלוח ${fmt(n)} נקודות ל-${p.name || p.id}?`)) return;
    $('#send').disabled = true;
    try { const r = await rpc('beam_admin_gift', { p_id: p.id, p_amount: n, p_note: $('#note').value }); toast(r === 'ok' ? `נשלחו ${fmt(n)} נקודות. הן יקפצו לשחקן בפעם הבאה שהמשחק פתוח אצלו.` : 'השליחה נכשלה'); if (r === 'ok') { cover.remove(); player(p.id); } }
    catch (e) { toast('השליחה נכשלה'); $('#send').disabled = false; }
  };
}
let lsort = ['n', 1];
async function levels() {
  const SPECIAL = { daily: { n: 900, label: 'אתגר יומי' }, duel: { n: 901, label: 'דו-קרב (כל הסיבובים)' }, weekly: { n: 902, label: 'אתגר השבוע' } };
  const rows = (await rpc('beam_admin_levels')).map(l => ({ ...l, ...(LEVELS[l.level_id] || SPECIAL[l.level_id] || { n: 999 }) })).filter(l => l.n < 999);   // levels that were replaced long ago are left out
  const draw = () => {
    const [k, dir] = lsort; rows.sort((a, b) => ((+a[k] || 0) - (+b[k] || 0)) * dir);
    const H = [['n', 'שלב'], ['starts', 'התחילו'], ['finishes', 'פתרו'], ['finish_pct', '% פתרו'], ['avg_seconds', 'זמן ממוצע'], ['avg_moves', 'מהלכים'], ['three_star_pct', '% 3 כוכבים'], ['helped_pct', '% עם עזרה']];
    $('#main').innerHTML = `<div class="panel"><h2>איך השלבים עובדים בפועל</h2><p class="empty" style="padding:0 0 10px">שלבים באדום: פחות מ-60% מהשחקנים שהתחילו אותם פתרו. לחיצה על כותרת ממיינת.</p><div class="scroll"><table><thead><tr>${H.map(([key, t]) => `<th data-k="${key}">${t}${lsort[0] === key ? (lsort[1] > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(l => `<tr class="${l.starts >= 3 && l.finish_pct < 60 ? 'hard' : ''}"><td>${l.label ? `<b>${l.label}</b>` : `<b>${l.n}</b> <small style="color:var(--muted)">פרק ${l.ch} · ${l.size}×${l.size} · ${l.max} מראות</small>`}</td><td>${fmt(l.starts)}</td><td>${fmt(l.finishes)}</td><td>${Math.round(l.finish_pct || 0)}%</td><td>${l.avg_seconds ? Math.floor(l.avg_seconds / 60) + ':' + String(Math.round(l.avg_seconds % 60)).padStart(2, '0') : '–'}</td><td>${Math.round(l.avg_moves || 0)}</td><td>${Math.round(l.three_star_pct || 0)}%</td><td>${Math.round(l.helped_pct || 0)}%</td></tr>`).join('')}</tbody></table></div></div>`;
    for (const th of document.querySelectorAll('th[data-k]')) th.onclick = () => { lsort = [th.dataset.k, lsort[0] === th.dataset.k ? -lsort[1] : (th.dataset.k === 'n' ? 1 : -1)]; draw(); };
  };
  draw();
}
/* item names: read from the game page's shop, like the level names */
let ITEMS = {};
async function loadItemNames(src) {
  try {
    const m = src.match(/const SHOP = (\{[\s\S]*?\n\});/); if (!m) return;
    const cats = { beam: 'קרן', board: 'לוח', fx: 'אפקט', char: 'דמות' };
    for (const [cat, label] of Object.entries(cats)) {
      const blk = m[1].slice(m[1].indexOf(cat + ': {')); const end = blk.indexOf('] }');
      for (const x of blk.slice(0, end).matchAll(/\{ id: '([^']+)', name: '((?:[^'\\]|\\.)*)', price: (\d+)/g)) ITEMS[cat + ':' + x[1]] = { name: x[2].replace(/\\'/g, "'"), cat: label, price: +x[3] };
    }
  } catch (e) { /* ids are shown instead */ }
  try {   // garden and room pieces
    const g = src.match(/const GARDEN = \{[\s\S]*?\n\};/), r = src.match(/const ROOM = \[[\s\S]*?\n\];/);
    if (g) { for (const x of g[0].matchAll(/\{ id: '([^']+)', name: '([^']+)', price: (\d+)/g)) ITEMS['garden:' + x[1]] = { name: x[2], cat: 'גן', price: +x[3] };
      [...g[0].matchAll(/name: '([^']+)' \}/g)].forEach((x, i) => { ITEMS['garden:house' + (i + 1)] = { name: x[1], cat: 'בית' }; }); }
    if (r) for (const x of r[0].matchAll(/\{ id: '([^']+)', name: '([^']+)', price: (\d+)/g)) ITEMS['room:' + x[1]] = { name: x[2], cat: 'בתוך הבית' };
  } catch (e) { /* ids are shown instead */ }
  Object.assign(ITEMS, { 'power:mirror': { name: 'מראה נוספת', cat: 'עזרה בשלב' }, 'power:hammer': { name: 'פטיש', cat: 'עזרה בשלב' }, 'power:hint': { name: 'רמז', cat: 'עזרה בשלב' }, 'power:time': { name: 'עוד דקה', cat: 'עזרה בשלב' } });
  ITEMS.remove_ads = { name: 'הסרת פרסומות', cat: 'כסף אמיתי' };
  for (const [n, k] of [[500, 'coins_500'], [1000, 'coins_1000'], [2000, 'coins_2000'], [5000, 'coins_5000'], [12000, 'coins_12000'], [30000, 'coins_30000']]) ITEMS[k] = { name: `${fmt(n)} נקודות`, cat: 'כסף אמיתי' };
}
const itemOf = k => ITEMS[k] || { name: k, cat: '' };
let bview = 'feed';   // newest purchases first: every buy, with who and when
async function buys() {
  const d = await rpc('beam_admin_purchases'), rows = d.rows;
  const byItem = {};
  for (const r of rows) (byItem[r.item] = byItem[r.item] || []).push(r);
  const items = Object.entries(byItem).sort((a, b) => b[1].length - a[1].length);
  const buyers = new Set(rows.map(r => r.player_id)).size, money = rows.filter(r => r.money).length;
  $('#main').innerHTML = `<div class="grid"><div class="stat hot"><b>${fmt(rows.length)}</b><span>פריטים שנקנו</span></div><div class="stat"><b>${fmt(buyers)}</b><span>שחקנים שקנו</span></div><div class="stat"><b>${fmt(d.today)}</b><span>רכישות היום</span></div><div class="stat"><b>${fmt(d.points_spent)}</b><span>נקודות שהוצאו (מאז היום)</span></div></div>
    <div class="panel"><h2>תשלומים בכסף אמיתי <span class="pill g">${fmt(money)} תשלומים</span> <span class="pill y">₪${(rows.filter(r => r.money).reduce((n, r) => n + (r.price || 0), 0) / 100).toLocaleString('he-IL', { minimumFractionDigits: 2 })}</span></h2>
      <div class="feed">${rows.filter(r => r.money).length ? rows.filter(r => r.money).map(r => `<div class="buyer" data-id="${esc(r.player_id)}" style="cursor:pointer">${av(r.avatar)}<b>${esc(r.name || r.player_id)}</b><span>${esc(itemOf(r.item).name)}</span>${r.price ? `<span class="pill g">₪${(r.price / 100).toFixed(2)}</span>` : ''}<small>${r.at ? when(r.at) : ''}</small></div>`).join('')
        : '<p class="empty">עוד אף אחד לא שילם. התשלום עדיין לא מחובר למשחק: כשיחובר, כל מי שקונה נקודות או מסיר פרסומות יופיע כאן, עם הסכום והשעה.</p>'}</div></div>
    <div class="tabs" style="margin-top:14px"><button data-v="items" class="${bview === 'items' ? 'on' : ''}">לפי פריט</button><button data-v="feed" class="${bview === 'feed' ? 'on' : ''}">לפי זמן</button></div>
    <div id="bv"></div>`;
  for (const b of document.querySelectorAll('[data-v]')) b.onclick = () => { bview = b.dataset.v; buys(); };
  if (bview === 'items') {
    $('#bv').innerHTML = items.length ? items.map(([k, list]) => { const it = itemOf(k); return `<div class="panel"><h2>${esc(it.name)} <span class="pill">${esc(it.cat)}</span> <span class="pill y">${list.length} קנו</span>${it.price ? ` <span class="pill">${fmt(it.price)} נק׳</span>` : ''}</h2>
      <div class="chips">${list.map(r => `<span class="buyer" data-id="${esc(r.player_id)}" style="cursor:pointer">${esc(r.name || r.player_id)}${r.at ? ' · ' + when(r.at) : ''}</span>`).join('')}</div></div>`; }).join('') : '<p class="empty">עוד אף אחד לא קנה כלום.</p>';
  } else {
    const dated = rows.filter(r => r.at), old = rows.length - dated.length;
    $('#bv').innerHTML = `<div class="panel"><div class="feed">${dated.length ? dated.map(r => { const it = itemOf(r.item); return `<div class="buyer" data-id="${esc(r.player_id)}" style="cursor:pointer">${av(r.avatar)}<b>${esc(r.name || r.player_id)}</b><span>קנה ${esc(it.name)}</span><span class="pill">${esc(it.cat)}</span>${r.money ? `<span class="pill g">${r.price ? '₪' + (r.price / 100).toFixed(2) : 'כסף אמיתי'}</span>` : r.price ? `<span class="pill y">${fmt(r.price)} נק׳</span>` : ''}<small>${when(r.at)}</small></div>`; }).join('') : '<p class="empty">מעכשיו כל רכישה תופיע כאן עם התאריך.</p>'}</div>
      ${old ? `<p class="empty">${old} רכישות קודמות נעשו לפני שהתחלנו לרשום תאריכים. הן מופיעות בתצוגה "לפי פריט".</p>` : ''}</div>`;
  }
  for (const b of document.querySelectorAll('.buyer')) b.onclick = () => player(b.dataset.id);
}
async function activity() {
  const a = await rpc('beam_admin_activity');
  $('#main').innerHTML = `<div class="panel"><h2>מתנות אחרונות</h2><div class="feed">${a.gifts.length ? a.gifts.map(g => `<div><b>+${fmt(g.amount)}</b><span>${esc(g.from_name || 'ממך')} ← ${esc(g.to_name || g.player_id)}</span>${g.from_name || g.note === 'gift from the owner' ? '' : `<span class="pill">${esc(noteOf(g.note))}</span>`}<small>${when(g.created_at)} · ${g.claimed_at ? 'נאסף' : '<span class="pill y">ממתין</span>'}</small></div>`).join('') : '<p class="empty">אין עדיין.</p>'}</div></div>
    <div class="panel"><h2>דו-קרבים אחרונים</h2><div class="feed">${a.duels.length ? a.duels.map(d => `<div><span>${esc(d.p1_name)} <b>${d.p1_wins}:${d.p2_wins}</b> ${esc(d.p2_name)}</span>${d.stake ? `<span class="pill">על ${fmt(d.stake)}</span>` : ''}<span class="pill">${['קל', 'בינוני', 'קשה'][d.gen - 30] || 'גרסה ישנה'}</span>${d.status !== 'done' ? '<span class="pill g">משחקים עכשיו</span>' : !d.winner ? '<span class="pill r">לא הסתיים</span>' : ''}<small>${when(d.created_at)}</small></div>`).join('') : '<p class="empty">אין עדיין.</p>'}</div></div>`;
}

/* ---- start ---- */
function gate(title, text, button) {
  app.innerHTML = `<div class="center"><div><img src="/icons/icon-192.png" alt=""><h1>${title}</h1><p>${text}</p>${button || ''}</div></div>`;
}
async function boot() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('access_token')) {
    Sess.set({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_at: Date.now() + (+h.get('expires_in') || 3600) * 1000 });
    try { history.replaceState(null, '', location.pathname); localStorage.removeItem('beamAdminPending'); } catch (e) {}
  }
  if (!Sess.get()) return gate('ניהול BEAM', 'הכניסה רק לבעל המשחק, עם חשבון Google שלו.', '<button class="btn gold" id="in">כניסה עם Google</button>'), $('#in').onclick = signIn;
  gate('ניהול BEAM', 'בודקים הרשאה…');
  let ok = false;
  try { ok = await rpc('beam_admin_is'); } catch (e) { if (e.message !== 'signed out') return gate('ניהול BEAM', 'אין חיבור לשרת כרגע. נסו שוב בעוד רגע.', '<button class="btn gold" onclick="boot()">לנסות שוב</button>'); }
  if (!ok) {
    const t = await Sess.token(); Sess.set(null);
    if (t) fetch(`${BACKEND.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: BACKEND.key, Authorization: 'Bearer ' + t } }).catch(() => {});
    return gate('אין הרשאה', 'החשבון הזה אינו מנהל המשחק.', '<button class="btn gold" id="in">כניסה עם חשבון אחר</button>'), $('#in').onclick = signIn;
  }
  try { const u = await (await fetch(`${BACKEND.url}/auth/v1/user`, { headers: { apikey: BACKEND.key, Authorization: 'Bearer ' + await Sess.token() } })).json(); me = u.email || ''; } catch (e) {}
  await loadLevelNames();
  show();
}
boot();
</script>
